<!doctype html><html><head><meta charset="utf-8"/><title>Emotion Research — Standalone</title>
<style>body{font-family:system-ui;margin:16px}video,canvas{border:1px solid #ccc;max-width:480px}#bars div{margin:2px}.bar{display:inline-block;height:12px;background:#4a90e2}</style></head>
<body><h2>Emotion Recognition Research — Standalone (no build)</h2>
<p><i>Apparent-expression hypothesis only — not proof of internal feeling. Local-first.</i></p>
<video id="v" autoplay playsinline width="480"></video><canvas id="c" width="320" height="240" style="display:none"></canvas>
<div><button onclick="start()">Start webcam</button><button onclick="stop()">Stop</button>
<select id="mode"><option>combined</option><option>face-only</option><option>body-only</option></select>
<label>Face model <select id="model"><option value="mini-xception">mini-Xception (unchanged default)</option><option value="vit">ViT (experimental, possible FER overlap)</option></select></label></div>
<div id="out"></div><div id="bars"></div><canvas id="tl" width="480" height="80"></canvas>
<script>const sessionId=crypto.randomUUID();if(sessionId.length<22)throw new Error('Secure session id unavailable');let timer=null,hist=[];async function start(){const v=document.getElementById('v');v.srcObject=await navigator.mediaDevices.getUserMedia({video:true});timer=setInterval(tick,800)}function stop(){clearInterval(timer);const v=document.getElementById('v');if(v.srcObject)v.srcObject.getTracks().forEach(t=>t.stop())}
async function tick(){const v=document.getElementById('v'),c=document.getElementById('c');if(!v.videoWidth)return;c.getContext('2d').drawImage(v,0,0,320,240);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));const fd=new FormData();fd.append('image',b,'f.jpg');try{const res=await fetch('http://127.0.0.1:8000/api/infer?model='+encodeURIComponent(document.getElementById('model').value),{method:'POST',headers:{'X-Socialcue-Session':sessionId},body:fd});const j=await res.json();if(!res.ok)throw new Error(j.detail||'Inference failed');hist.push(j.fusion);if(hist.length>60)hist.shift();render(j)}catch(e){document.getElementById('out').innerText='Inference unavailable: '+e.message}}
function render(j){const f=j.fusion;document.getElementById('out').innerHTML='<b>'+top(f.probs)+'</b> conf '+f.confidence.toFixed(2)+' unc '+f.uncertainty.toFixed(2)+' mode '+f.mode+'<br/>evidence: '+(f.evidence||[]).join(', ')+'<br/>valence '+(j.face.expression.valence??0).toFixed(2)+' arousal '+(j.face.expression.arousal??0).toFixed(2)+' source '+j.face.expression.source+'<br/>AUs: '+j.face.aus.map(a=>a.code+':'+a.intensity.toFixed(2)).join(' ')+'<br/><i>'+j.ethics_notice+'</i>';document.getElementById('bars').innerHTML=Object.entries(f.probs).map(([k,v])=>'<div>'+k+' <span class=bar style=width:'+(v*200)+'px></span> '+v.toFixed(2)+'</div>').join('');const t=document.getElementById('tl').getContext('2d');t.clearRect(0,0,480,80);hist.forEach((h,i)=>{t.fillStyle='#4a90e2';t.fillRect(i*8,80-h.confidence*80,6,h.confidence*80)})}
function top(p){return Object.entries(p).sort((a,b)=>b[1]-a[1])[0][0]}</script></body></html>
